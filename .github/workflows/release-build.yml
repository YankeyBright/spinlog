name: Release Build

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  quality:
    name: Release Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '24.19.0', '26.0.0']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Foundation, Documentation, And Stability
        run: |
          npm run check:foundation
          npm run check:phase4
          npm run test:stability

      - name: Audit Dependency Graph
        run: npm audit --audit-level=low

  package:
    name: Build Exact Release Artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Release Ancestry And Gates
        run: |
          npm run verify:preview
          npm run check:release-ancestry
          npm run check:phase3
          npm run check:phase5

      - name: Record npm Version
        run: echo "NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"

      - name: Pack And Verify Exact Release Artifact
        run: |
          npm run build
          npm run sbom
          npm run pack:check
          node -e "require('fs').mkdirSync('artifacts/release',{recursive:true})"
          npm pack --json --ignore-scripts --pack-destination artifacts/release
          node scripts/create-release-manifest.mjs artifacts/release
          node scripts/verify-release-artifact.mjs artifacts/release
          node scripts/verify-packed-runtime.mjs artifacts/release

      - name: Upload Release Candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spinlog-release-candidate
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  consumer:
    name: Release Consumer (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.13.0', '24.x', '26.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Consumer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download Release Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spinlog-release-candidate
          path: artifacts/release

      - name: Verify Packed Runtime
        run: node scripts/verify-packed-runtime.mjs artifacts/release

  attest:
    name: Attest And Upload Verified Release Artifact
    needs: [package, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Release Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spinlog-release-candidate
          path: artifacts/release

      - name: Verify Release Manifest And Integrity
        run: node scripts/verify-release-artifact.mjs artifacts/release

      - name: Generate GitHub Artifact Attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/release/spinlog-0.2.0.tgz

      - name: Upload Verified Release Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spinlog-release-${{ github.sha }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
