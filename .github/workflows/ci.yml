name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: YankeyBright/spinlog
  REPOSITORY_PRIVATE: ${{ github.event.repository.private }}

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '22.x', '24.0.0', '24.x', '26.0.0', '26.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Foundation And Documentation
        run: |
          npm run check:foundation
          npm run check:phase4

      - name: Audit Dependency Graph
        run: npm audit --audit-level=low

  packed-artifact:
    name: Build Packed Runtime (Node 24)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Build Exact Package Artifact
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run sbom
          npm run pack:check
          node -e "require('fs').mkdirSync('artifacts/package',{recursive:true})"
          npm pack --json --ignore-scripts --pack-destination artifacts/package

      - name: Upload Packed Runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spinlog-packed-runtime
          path: artifacts/package/*.tgz
          if-no-files-found: error
          retention-days: 14

  packed-consumer:
    name: Packed Consumer (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: packed-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.13.0', '24.x', '26.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Consumer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download Packed Runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spinlog-packed-runtime
          path: artifacts/package

      - name: Verify Runtime Without Development Dependencies
        run: node scripts/verify-packed-runtime.mjs artifacts/package

  baseline-status:
    name: Detect Committed Benchmark Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.baseline.outputs.present }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Baseline Availability
        id: baseline
        run: |
          if test -f bench/baseline.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Committed benchmark baseline is absent; candidate verification is deferred."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark-baseline-run:
    name: Baseline Run ${{ matrix.slot }} (Node 24)
    needs: [quality, packed-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Build And Measure Baseline Input
        env:
          BENCHMARK_RUN_SLOT: ${{ matrix.slot }}
        run: |
          npm run build
          npm run benchmark

      - name: Upload Immutable Baseline Input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-baseline-run-${{ matrix.slot }}
          path: artifacts/phase3/benchmark.json
          if-no-files-found: error
          retention-days: 14

  benchmark-baseline-candidate:
    name: Aggregate Reviewable Baseline Candidate
    needs: benchmark-baseline-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Download Baseline Inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase3-baseline-run-*
          path: artifacts/phase3/baseline-runs

      - name: Aggregate Baseline Candidate Without Modifying The Contract
        run: node bench/aggregate-baseline.mjs artifacts/phase3/baseline-runs/phase3-baseline-run-1/benchmark.json artifacts/phase3/baseline-runs/phase3-baseline-run-2/benchmark.json artifacts/phase3/baseline-runs/phase3-baseline-run-3/benchmark.json artifacts/phase3/baseline-runs/phase3-baseline-run-4/benchmark.json artifacts/phase3/baseline-runs/phase3-baseline-run-5/benchmark.json --out artifacts/phase3/baseline-candidate.json

      - name: Upload Baseline Candidate For Review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-baseline-candidate
          path: artifacts/phase3/baseline-candidate.json
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Phase 3 Candidate Verification (Node 24)
    needs: [quality, packed-consumer, baseline-status]
    if: ${{ needs.baseline-status.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Candidate Against The Committed Baseline
        run: |
          npm run verify:candidate
          npm run check:phases

      - name: Upload Phase 3 Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-node24-evidence
          path: artifacts/phase3
          if-no-files-found: error
          retention-days: 14
