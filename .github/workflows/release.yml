name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Trusted Publishing Toolchain
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          node -e "const { execSync } = require('node:child_process'); const [major, minor, patch] = execSync('npm --version').toString().trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)"

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Release Tag
        run: node -e "const { readFileSync } = require('node:fs'); const { version } = JSON.parse(readFileSync('package.json', 'utf8')); const expected = 'v' + version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('tag must equal ' + expected); process.exit(1) }"

      - name: Verify Release Candidate
        run: |
          npm run check:phases
          npm audit --audit-level=low

      - name: Publish Package with Provenance
        run: npm publish --provenance

      - name: Create GitHub Release with SBOM
        run: gh release create "$GITHUB_REF_NAME" sbom.json --title "$GITHUB_REF_NAME" --notes "spinlog $GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
