name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  EXPECTED_REPOSITORY: YankeyBright/spinlog
  REPOSITORY_PRIVATE: ${{ github.event.repository.private }}

jobs:
  verify:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Phase 0 and Phase 1
        run: |
          npm run check:phase0
          npm run check:phase1

  supply-chain:
    name: Supply Chain (Node 24)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies Without Lifecycle Hooks
        run: npm ci --ignore-scripts

      - name: Verify Ordered Phase Gates
        run: npm run check:phases

      - name: Audit Dependency Graph
        run: npm audit --audit-level=low
